<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Code Explainer</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <h1>AI Code Explainer</h1>

    <div class="controls">
        <select id="codeLanguage">
            <option value="Javascript">Javascript</option>
            <option value="Java">Java</option>
            <option value="C">C</option>
            <option value="C++">C++</option>
            <option value="python">Python</option>
            <option value="HTML">HTML</option>
            <option value="CSS">CSS</option>
            <option value="react">React</option>
            <option value="node.js">Node.js</option>
            <option value="SQL">SQL</option>
        </select>

        <select id="level">
            <option value="beginner">Beginner</option>
            <option value="intermediate">Intermediate</option>
            <option value="advanced">Advanced</option>
        </select>

        <select id="explainLang">
            <option value="en">English</option>
            <option value="hi">Hindi</option>
        </select>

        <button onclick="explainCode()">Explain Code</button>
    </div>

    <div class="container">
        <div class="box">
            <div class="box-header">
                <h3>Explanation</h3>
                <div class="box-buttons">
                    <button onclick="copyExplanation()">Copy</button>
                </div>
            </div>
            <div id="loading" class="loading">
                <div class="spinner"></div>
                <p id="loadingText">AI is explaining the code...</p>
            </div>
            <pre id="output">Your code Explanation will appear here...</pre>
        </div>

        <div class="box">
            <div class="box-header">
                <h3>Code</h3>
                <div class="box-buttons">
                    <button onclick="pasteCode()">Paste Code</button>
                    <button onclick="clearCode()">Clear Code</button>
                </div>
            </div>
            <textarea id="codeInput" placeholder="Paste your code here..."></textarea>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
